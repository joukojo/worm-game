name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-release-assets:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Compute artifact names
        id: names
        run: |
          version="${GITHUB_REF_NAME}"
          archive_name="worm-game_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          echo "archive_name=${archive_name}" >> "${GITHUB_OUTPUT}"
          echo "binary_path=dist/${archive_name}/worm-game" >> "${GITHUB_OUTPUT}"
          echo "archive_path=dist/${archive_name}.tar.gz" >> "${GITHUB_OUTPUT}"
          echo "sbom_path=dist/${archive_name}.sbom.spdx.json" >> "${GITHUB_OUTPUT}"

      - name: Build release archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p "dist/${{ steps.names.outputs.archive_name }}"
          go build -o "${{ steps.names.outputs.binary_path }}" ./cmd/worm-game
          cp README.md LICENSE "dist/${{ steps.names.outputs.archive_name }}/"
          tar -C dist -czf "${{ steps.names.outputs.archive_path }}" "${{ steps.names.outputs.archive_name }}"

      - name: Generate SBOM with Syft
        run: >
          ${{ steps.syft.outputs.cmd }}
          ${{ steps.names.outputs.binary_path }}
          -o spdx-json=${{ steps.names.outputs.sbom_path }}

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ steps.names.outputs.archive_path }}
            ${{ steps.names.outputs.sbom_path }}
          if-no-files-found: error

  publish-release-assets:
    runs-on: ubuntu-latest
    needs: build-release-assets

    steps:
      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-assets-*
          merge-multiple: true

      - name: Create checksum file
        run: |
          cd dist
          shasum -a 256 *.tar.gz *.sbom.spdx.json > checksums.txt

      - name: Build asset list for release notes
        run: |
          {
            echo
            echo "## Release Assets"
            echo
            for file in $(find dist -maxdepth 1 -type f | sed 's#^dist/##' | sort); do
              echo "- ${file}"
            done
          } > release-assets.md

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sbom.spdx.json
            dist/checksums.txt

      - name: Append asset list to release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --json body --jq '.body' > current-release-body.md
          awk '/^## Release Assets$/ { exit } { print }' current-release-body.md > base-release-body.md
          cat base-release-body.md release-assets.md > updated-release-body.md
          gh release edit "${GITHUB_REF_NAME}" --notes-file updated-release-body.md
